[package]
name = "spare-dongle"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Flash and inspect the SpareDongle firmware"
repository = "https://github.com/valeronm/spare-dongle"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serialport = { version = "4.10", default-features = false }
