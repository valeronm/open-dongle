language = "C"
include_guard = "DIAGWIRE_H"
style = "tag"
usize_is_size_t = true
autogen_warning = "/* Generated by cbindgen from wire/src/lib.rs and ffi/src/lib.rs; edit those instead. */"

[export]
# Enums no exported function takes, so cbindgen would leave them out.
include = [
  "Command", "ErrorCode", "Protocol", "DeviceKind", "LinkState", "UnifyingStatus", "BtLink", "Window",
  "Charging", "EventType", "Divert", "Wheel", "Refused", "Forgotten", "Up", "Moved",
]

